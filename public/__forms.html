<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FOGRod Forms</title>
  </head>
  <body>
    <form name="contact" method="POST" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="name" type="text" />
      <input name="email" type="email" />
      <input name="company" type="text" />
      <textarea name="message"></textarea>
    </form>
    <form name="trade-request" method="POST" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="trade-request" />
      <input name="company" type="text" />
      <input name="website" type="text" />
      <input name="contact" type="text" />
      <input name="email" type="email" />
      <input name="phone" type="text" />
      <textarea name="address"></textarea>
      <input name="company-number" type="text" />
      <textarea name="requirements"></textarea>
    </form>
    <form name="trade-order" method="POST" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="trade-order" />
      <input name="order-number" type="text" />
      <input name="customer-email" type="email" />
      <input name="company" type="text" />
      <input name="purchase-order" type="text" />
      <textarea name="billing-address"></textarea>
      <textarea name="delivery-address"></textarea>
      <textarea name="items"></textarea>
      <input name="subtotal" type="text" />
      <input name="vat" type="text" />
      <input name="total" type="text" />
      <input name="payment-method" type="text" />
    </form>
  </body>
</html>
